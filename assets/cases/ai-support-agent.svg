      <stop offset="0.48" stop-color="#164e63"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#06111f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g opacity="0.24" stroke="#67e8f9" stroke-width="2">
    <path d="M182 192 H380 L500 296 H700"/>
    <path d="M214 552 H420 L560 446 H748"/>
