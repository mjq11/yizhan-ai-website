<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">官网上线托管包案例图</title>
  <desc id="desc">网站上线托管流程，包含域名、服务器、HTTPS、监控和备案提醒。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.54" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#06111f" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g stroke="#7dd3fc" stroke-width="3" opacity="0.22">
    <path d="M180 248 H1020"/>
    <path d="M340 248 V520"/>
    <path d="M600 248 V520"/>
    <path d="M860 248 V520"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="128" y="132" width="944" height="456" rx="30" fill="#ffffff"/>
    <text x="184" y="206" fill="#0f172a" font-size="42" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">官网上线托管包</text>
    <text x="186" y="252" fill="#1d4ed8" font-size="22" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">域名解析 · HTTPS证书 · 访问监控 · 备案资料提醒</text>
    <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
      <rect x="184" y="316" width="174" height="126" rx="20" fill="#eff6ff"/>
      <text x="232" y="366" fill="#1d4ed8" font-size="24" font-weight="900">域名</text>
      <text x="218" y="404" fill="#64748b" font-size="16" font-weight="800">DNS解析</text>
      <rect x="394" y="316" width="174" height="126" rx="20" fill="#ecfdf5"/>
      <text x="430" y="366" fill="#047857" font-size="24" font-weight="900">服务器</text>
      <text x="430" y="404" fill="#64748b" font-size="16" font-weight="800">环境配置</text>
      <rect x="604" y="316" width="174" height="126" rx="20" fill="#fff7ed"/>
      <text x="648" y="366" fill="#c2410c" font-size="24" font-weight="900">HTTPS</text>
      <text x="642" y="404" fill="#64748b" font-size="16" font-weight="800">证书部署</text>
      <rect x="814" y="316" width="174" height="126" rx="20" fill="#f0f9ff"/>
      <text x="858" y="366" fill="#0369a1" font-size="24" font-weight="900">监控</text>
      <text x="852" y="404" fill="#64748b" font-size="16" font-weight="800">访问巡检</text>
    </g>
    <rect x="184" y="490" width="804" height="58" rx="16" fill="#f8fafc"/>
    <text x="226" y="527" fill="#334155" font-size="20" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">1-2天交付 · 域名 · 证书 · 服务器 · 监控 · 交付后稳定访问</text>
  </g>
</svg>
