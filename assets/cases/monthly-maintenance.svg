<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">月度维护服务案例图</title>
  <desc id="desc">月度维护服务看板，包含巡检、备份、小改、问题处理和更新记录。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.52" stop-color="#475569"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#06111f" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="112" y="92" width="976" height="576" rx="28" fill="#f8fafc"/>
    <rect x="160" y="140" width="416" height="424" rx="24" fill="#111827"/>
    <text x="206" y="212" fill="#ffffff" font-size="42" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">月度维护</text>
    <text x="208" y="258" fill="#bbf7d0" font-size="22" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">巡检 · 备份 · 小改 · 故障排查</text>
    <circle cx="368" cy="408" r="92" fill="none" stroke="#334155" stroke-width="22"/>
    <path d="M368 316 A92 92 0 1 1 300 472" fill="none" stroke="#22c55e" stroke-width="22" stroke-linecap="round"/>
    <text x="326" y="418" fill="#ffffff" font-size="30" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">稳定</text>
    <rect x="622" y="140" width="390" height="92" rx="18" fill="#ecfdf5"/>
    <text x="664" y="196" fill="#166534" font-size="26" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">每周巡检</text>
    <rect x="622" y="260" width="390" height="92" rx="18" fill="#eff6ff"/>
    <text x="664" y="316" fill="#1d4ed8" font-size="26" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">数据备份</text>
    <rect x="622" y="380" width="390" height="92" rx="18" fill="#fff7ed"/>
    <text x="664" y="436" fill="#c2410c" font-size="26" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">页面小改</text>
    <rect x="622" y="500" width="390" height="92" rx="18" fill="#f1f5f9"/>
    <text x="664" y="556" fill="#334155" font-size="26" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">问题处理</text>
    <rect x="160" y="604" width="852" height="44" rx="12" fill="#ffffff"/>
    <text x="204" y="633" fill="#334155" font-size="18" font-weight="900" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">按月服务 · 内容调整 · 图片替换 · 备份巡检 · 不用临时找人救火</text>
  </g>
</svg>
